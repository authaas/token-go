version: v2

managed:
  enabled: true
  override:
    - file_option: go_package
      module: buf.build/authaas/token
      value: github.com/authaas/token-go;token
    - file_option: go_package_prefix
      module: buf.build/authaas/identity
      value: buf.build/gen/go/authaas/identity/protocolbuffers/go

inputs:
  - module: buf.build/authaas/token:0.2.2

plugins:
  - remote: buf.build/protocolbuffers/go
    out: module
    opt:
      - module=github.com/authaas/token-go
