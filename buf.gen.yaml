version: v2

managed:
  enabled: true
  override:
    - file_option: go_package
      module: buf.build/authaas/token
      value: github.com/authaas/token-go;token

inputs:
  - module: buf.build/authaas/token:0.2.0

plugins:
  - remote: buf.build/protocolbuffers/go
    out: module
    opt:
      - module=github.com/authaas/token-go
